<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Olá, sou Nickollas. Tech Stack: HTML, CSS, JavaScript, PHP e SQL" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .ch { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 58px;
        transform-box: fill-box; transform-origin: 50% 50%;
        animation: enter .9s cubic-bezier(.34,1.56,.64,1) both; }
  .float { animation: float 1.4s ease-in-out infinite alternate both; }
  .label { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 14px; letter-spacing: .3em;
           fill: #A1A1AA; animation: fade .6s ease-out 2.7s both; }
  .card { transform-box: fill-box; transform-origin: 50% 50%;
          animation: cardIn .7s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(100px) scale(.3) rotate(var(--r)); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(.7); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
